<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Reader portal · The Reading Den</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>"/>
<link rel="stylesheet" href="assets/style.css"/>
</head>
<body class="portal">

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark" aria-hidden="true">📖</span>
    <span><span class="brand-name">The Reading Den</span><span class="brand-sub">Reader portal</span></span>
  </a>
  <div class="topbar-right">
    <span class="syncpill" id="syncpill"></span>
    <a class="btn ghost small" href="play.html" target="_blank" rel="noopener">Open his screen ↗</a>
  </div>
</header>

<div class="shell">
  <div class="navwrap">
  <button class="menutoggle" id="menutoggle" aria-controls="sidebar" aria-expanded="false">
    <span class="mt-burger" aria-hidden="true"><span></span><span></span><span></span></span>
    <span class="mt-current" id="mt-current"></span>
    <span class="mt-hint" aria-hidden="true">Activities</span>
  </button>
  <nav class="sidebar" id="sidebar" aria-label="Activities"></nav>
  </div>

  <main class="main">
    <div class="levelbar">
      <div class="levelbar-links">
        <button class="linkbtn" id="directions-toggle">Directions</button>
      </div>
      <div class="levelchips">
        <button class="levelchip" id="chip-level">
          <span class="lc-label">Activity Level</span>
          <span class="lc-value" id="lc-level">1</span>
          <span class="lc-pencil" aria-hidden="true">✎</span>
          <span class="lc-sub" id="lc-level-sub"></span>
        </button>
        <button class="levelchip" id="chip-band">
          <span class="lc-label">Story Level</span>
          <span class="lc-value"><span class="bandtag" id="lc-band">Pink</span></span>
          <span class="lc-pencil" aria-hidden="true">✎</span>
        </button>
      </div>
    </div>

    <div class="tabs" id="tabs"></div>
    <section class="directions" id="directions" hidden></section>
    <section class="practise" id="practise" hidden></section>
    <section class="stage" id="stage"></section>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="modal-card" id="modal-card"></div></div>

<script src="assets/data/words.js"></script>
<script src="assets/data/phonics.js"></script>
<script src="assets/data/art.js"></script>
<script src="assets/data/stories.js"></script>
<script src="assets/core.js"></script>
<script src="assets/activities.js"></script>
<script src="assets/coach.js"></script>
</body>
</html>
