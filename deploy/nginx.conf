# Minimal static-file config. The no-cache header matters here specifically
# because this is a small app you'll likely keep editing (adding words,
# ticking off progress) — without it, browsers can hang on to an old
# version of assets/data.js after you update it on the NAS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
