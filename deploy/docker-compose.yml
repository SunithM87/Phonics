# See README.md ("Hosting it on a NAS") before editing this file.
#
# On UGOS Pro's Docker app this is deployed as a "Project". Before you
# deploy it, change BOTH volumes paths below from the relative "../" and
# "./data" to the actual absolute paths on your NAS — copy them from the
# Files app rather than guessing (UGREEN's own Docker guide recommends
# this too, since the path scheme can differ between models). Example, if
# you copied the repo into a shared folder called "reading-den":
#   /volume1/reading-den:/app/public:ro
#   /volume1/reading-den/deploy/data:/app/data
#
# If your NAS's Docker "Project" UI doesn't support the `build:` section
# below, run this once over SSH instead (Control Panel > Terminal to
# enable it): `docker compose up -d --build` from this folder — that
# builds the image locally and starts it, and the Project UI can still
# manage it afterwards.

services:
  reading-den:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: reading-den
    restart: unless-stopped
    ports:
      - "8080:8080" # visit http://<your-nas-ip>:8080 — change the left-hand
                     # number if 8080 is already used by something else
    environment:
      - PORT=8080
      - PUBLIC_DIR=/app/public
      - STATE_FILE=/app/data/state.json
    volumes:
      - ../:/app/public:ro
      - ./data:/app/data
